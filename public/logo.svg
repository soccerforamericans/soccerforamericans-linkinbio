<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- SoccerForAmericans crest: navy shield, three stars, soccer ball,
       red stripes at the base, pitch-green trim. -->
  <defs>
    <clipPath id="shield-clip">
      <path d="M48 6 L84 17 V52 C84 73 67 85 48 91 C29 85 12 73 12 52 V17 Z"/>
    </clipPath>
  </defs>

  <!-- Shield body -->
  <path d="M48 6 L84 17 V52 C84 73 67 85 48 91 C29 85 12 73 12 52 V17 Z" fill="#0a1f44"/>

  <!-- Red stripes across the lower third -->
  <g clip-path="url(#shield-clip)">
    <rect x="10" y="66" width="76" height="5.5" fill="#e63e5c"/>
    <rect x="10" y="77" width="76" height="5.5" fill="#e63e5c"/>
    <rect x="10" y="88" width="76" height="5.5" fill="#e63e5c"/>
  </g>

  <!-- Three stars -->
  <g fill="#ffffff">
    <path d="M30 18 l1.8 3.6 4 .6 -2.9 2.8 .7 4 -3.6 -1.9 -3.6 1.9 .7 -4 -2.9 -2.8 4 -.6 Z"/>
    <path d="M48 13 l1.8 3.6 4 .6 -2.9 2.8 .7 4 -3.6 -1.9 -3.6 1.9 .7 -4 -2.9 -2.8 4 -.6 Z"/>
    <path d="M66 18 l1.8 3.6 4 .6 -2.9 2.8 .7 4 -3.6 -1.9 -3.6 1.9 .7 -4 -2.9 -2.8 4 -.6 Z"/>
  </g>

  <!-- Soccer ball -->
  <circle cx="48" cy="48" r="15" fill="#ffffff"/>
  <polygon points="48,41 55,46 52.5,54 43.5,54 41,46" fill="#0a1f44"/>
  <g stroke="#0a1f44" stroke-width="1.6" stroke-linecap="round">
    <line x1="48" y1="41" x2="48" y2="33.5"/>
    <line x1="55" y1="46" x2="61.5" y2="42.5"/>
    <line x1="41" y1="46" x2="34.5" y2="42.5"/>
    <line x1="52.5" y1="54" x2="56.5" y2="60.5"/>
    <line x1="43.5" y1="54" x2="39.5" y2="60.5"/>
  </g>

  <!-- Pitch-green trim -->
  <path d="M48 6 L84 17 V52 C84 73 67 85 48 91 C29 85 12 73 12 52 V17 Z"
        fill="none" stroke="#34d27b" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
